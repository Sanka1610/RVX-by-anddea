name: Sync upstream

on:
  schedule:
    - cron: '0 15 * * *' # JST 0:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Setup ours merge driver
        run: |
          git config --global merge.ours.driver true

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/j-hc/revanced-magisk-module.git || true

      - name: Fetch
        run: |
          git fetch origin
          git fetch upstream

      - name: Prepare upstream branch
        run: |
          git checkout -B upstream origin/main

      - name: Merge upstream
        run: |
          git merge upstream/main --no-edit --allow-unrelated-histories || {
            echo "Merge failed"
            exit 1
          }

      - name: Commit (if needed)
        run: |
          git add .
          git commit -m "sync upstream" || echo "no changes"

      - name: Push upstream branch
        run: |
          git push origin upstream --force