name: Promote upstream to main

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Fetch
        run: |
          git fetch origin

      - name: Checkout main
        run: |
          git checkout main

      - name: Merge upstream branch
        run: |
          git merge origin/upstream --no-edit || {
            echo "Merge failed"
            exit 1
          }

      - name: Push main
        run: |
          git push origin main